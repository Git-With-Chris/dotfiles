gui:
  nerdFontsVersion: "3"
  sidePanelWidth: 0.2
  showCommandLog: false
  border: single
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
    selectedLineBgColor:
      - blue
git:
  # pagers: disabled on Windows - diff-so-fancy is not installed here
  #   pagers:
  #     - colorArg: always
  #       pager: diff-so-fancy
  commit:
    signOff: false
  merging:
    manualCommit: false

keybinding:
  universal:
    quit: q
    return: <esc>
